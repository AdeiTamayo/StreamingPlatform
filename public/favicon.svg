<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <defs>
    <!-- Button shadow -->
    <filter id="button-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <!-- Triangle shadow -->
    <filter id="triangle-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0.3" stdDeviation="0.3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect
    x="1.5"
    y="3.5"
    width="13"
    height="9"
    rx="2.5"
    fill="#38bdf8"
    filter="url(#button-shadow)"
  />

  <!-- Centered rounded play icon -->
  <path
    d="M6.1 5.7
       Q6.1 5.4 6.35 5.55
       L10.1 7.75
       Q10.45 8 10.1 8.25
       L6.35 10.45
       Q6.1 10.6 6.1 10.3
       Z"
    fill="#fff"
    filter="url(#triangle-shadow)"
  />
</svg>
