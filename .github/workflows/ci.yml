name: CI

on:
  push:
    branches: [main, feat/*, fix/*, chore/*, refactor/*]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (verified against the v4 tags)
      # so a compromised tag move cannot inject code into CI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `tsc -b` rather than `tsc --noEmit` so the referenced tsconfig.node.json
      # is also built - that covers vite.config.ts and the scripts/ directory,
      # which the plain --noEmit invocation does not typecheck.
      - name: TypeScript check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      # Catches the class of problem where a dependency ships an advisory
      # between releases and the lockfile is never refreshed.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Test
        run: npm test
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_OMDB_API_KEY: ${{ secrets.VITE_OMDB_API_KEY }}

      # VITE_OMDB_API_KEY is required here too: a bundle built without it makes
      # getOmdbRatingByTitle return null for every card, so every IMDb badge
      # silently falls back to TMDB.
      - name: Build
        run: npm run build
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_OMDB_API_KEY: ${{ secrets.VITE_OMDB_API_KEY }}
